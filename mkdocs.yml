site_name: LEGO Analytics Hub
site_description: Relatório histórico do catálogo LEGO, de 1975 a 2025.
docs_dir: site_docs
site_dir: site
remote_branch: gh-pages
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
nav:
  - Início: index.md
  - Arquitetura: arquitetura.md
  - Desenvolvimento: desenvolvimento.md
  - Configuração: configuracao.md
  - Dashboard: dashboard.md
  - Pipelines:
      - Ingestão: pipelines/ingestao.md
      - Transformação: pipelines/transformacao.md
      - Marts: pipelines/marts.md
  - Relatório: relatorio.md
plugins:
  - search
